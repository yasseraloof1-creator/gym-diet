<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y.A.S — النادي والتغذية</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f4fa;
  --c:#ffffff;
  --c2:#f8f9fd;
  --t:#1a1e36;
  --m:#6e7594;
  --o:#7c3aed;
  --o2:#db2777;
  --ok:#10b981;
  --wn:#f59e0b;
  --bd:#e4e7f2;
  --i:#f1f3f9;
  --sh:0 8px 24px rgba(31,35,64,.06);
  --sh-lg:0 14px 32px rgba(124,58,237,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding-bottom:86px;min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--t)}
button{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;transition:transform .12s ease,opacity .15s ease,box-shadow .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.x{background:var(--i);color:var(--t);border:1px solid var(--bd);font-weight:500}
button.ok{background:var(--ok);color:#fff}
button.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{background:var(--i);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--o);background:#fff}
label.lbl{display:block;font-size:11.5px;color:var(--m);margin-bottom:4px;font-weight:600}

#app{max-width:680px;margin:0 auto;padding:12px 14px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:0;z-index:20;background:rgba(242,244,250,.9);backdrop-filter:blur(10px);padding:8px 2px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.brand{font-size:20px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,var(--o),var(--o2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.sub-badge{font-size:11px;color:var(--m);background:var(--c);border:1px solid var(--bd);padding:4px 10px;border-radius:99px;font-weight:600}

.card{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card-soft{background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-size:15px;font-weight:700}
.sec-title span.link{font-size:12px;color:var(--o);cursor:pointer;font-weight:600}
.muted{color:var(--m);font-size:12px}

.prog-wrap{margin-top:6px}
.prog-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;font-weight:600}
.prog-bar{height:8px;background:var(--i);border-radius:99px;overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .25s ease}
.prog-bar.ok i{background:linear-gradient(90deg,#10b981,#059669)}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 76%;scroll-snap-align:start;border-radius:20px;padding:15px;color:#fff;box-shadow:var(--sh-lg);position:relative;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.pcard .tag{align-self:flex-start;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.pcard b{font-size:17px;display:block;margin-top:6px}
.pcard small{opacity:.92;font-size:12px}
.pcard .prog-bar{background:rgba(255,255,255,.28);height:6px;margin-top:8px}
.pcard .prog-bar i{background:#fff}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:13px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh)}
.stat-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat-box b{display:block;font-size:17px;line-height:1.2}
.stat-box small{color:var(--m);font-size:11.5px}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:10px 6px;box-shadow:var(--sh)}
.wday{text-align:center;padding:6px 2px;border-radius:12px;font-size:11px;color:var(--m)}
.wday b{display:block;font-size:15px;color:var(--t);margin:2px 0}
.wday.today{background:rgba(124,58,237,.09);border:1px solid rgba(124,58,237,.25)}
.wday .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin:2px auto 0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--c);color:var(--t);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}

.ex-card{border-radius:18px;padding:12px 13px;margin-bottom:10px;background:var(--c);border:1px solid var(--bd);border-right:5px solid var(--o);box-shadow:var(--sh)}
.ex-card.done-today{background:#f0fdf4;border-color:#bbf7d0;border-right-color:var(--ok)}
.sets-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.set-chip{padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--i);font-size:12px;font-weight:700;cursor:pointer;color:var(--t)}
.set-chip.done{background:var(--ok);color:#fff;border-color:var(--ok)}

.pill-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.st-due{background:#fef3c7;color:#b45309}
.st-rest{background:#f1f5f9;color:#64748b}
.st-ok{background:#d1fae5;color:#065f46}

.timer-bar{position:fixed;bottom:68px;left:12px;right:12px;max-width:656px;margin:0 auto;z-index:25;background:#181b2e;color:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 28px rgba(0,0,0,.28)}
.timer-bar b{font-size:17px;font-variant-numeric:tabular-nums;color:#fbbf24}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);background:#181b2e;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:all .22s ease;box-shadow:0 10px 24px rgba(0,0,0,.22);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(15,18,34,.55);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal-sheet{background:var(--c);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;box-shadow:0 -12px 36px rgba(0,0,0,.2)}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(31,35,64,.06)}
nav button{flex:1;flex-direction:column;gap:2px;background:none;color:var(--m);font-size:10.5px;font-weight:600;padding:6px 2px;margin:0;border-radius:12px}
nav button.on{color:var(--o);background:rgba(124,58,237,.08);font-weight:700}
</style>
</head>
<body>

<script>

const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const todayStr = (offsetDays = 0) => {
  const d = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4 - offsetDays * 864e5);
  return d.toISOString().slice(0, 10);

const daysDiff = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);

].map(([g,n,u,k,p,f,h]) => ({g,n,u,k,p,f,h,v:false}));

function loadState(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem('yas_pro_v1') || localStorage.getItem('yas') || 'null'); } catch(e){}
  const s = raw || {};
  s.ex = Array.isArray(s.ex) ? s.ex : [];
  s.pr = Array.isArray(s.pr) ? s.pr : [];
  s.last = s.last && typeof s.last === 'object' ? s.last : {};
  s.mn = s.mn && typeof s.mn === 'object' ? s.mn : {};
  s.lw = Array.isArray(s.lw) ? s.lw : [];
  s.lf = s.lf && typeof s.lf === 'object' ? s.lf : {};
  s.sup = Array.isArray(s.sup) ? s.sup : [];
  s.body = Array.isArray(s.body) ? s.body : [];
  s.goal = s.goal && typeof s.goal === 'object' ? {k: num(s.goal.k)||2500, p: num(s.goal.p)||150, mode: s.goal.mode||'balanced'} : {k:2500, p:150, mode:'balanced'};
  s.wg = num(s.wg) || 3;
  s.foods = Array.isArray(s.foods) && s.foods.length ? s.foods : SEED_FOODS.map(x=>({...x}));
  if (s.fv !== 2) {
    SEED_FOODS.forEach(f => {
      if (!s.foods.some(x => x.n === f.n && x.g === f.g)) s.foods.push({...f});
    });
    s.fv = 2;
  }
  const td = todayStr();
  if (!s.day || s.day.d !== td) {
    s.day = { d: td, eat: [], w: 0, s: {}, supDoneAllDate: '' };
  } else {
    s.day.eat = Array.isArray(s.day.eat) ? s.day.eat : [];
    s.day.w = num(s.day.w);
    s.day.s = s.day.s && typeof s.day.s === 'object' ? s.day.s : {};
    s.day.supDoneAllDate = s.day.supDoneAllDate || '';
  }
  s.sup.forEach(item => {
    if (!item.id) item.id = 'sup_' + Math.random().toString(36).slice(2,8);
    if (!item.freq) item.freq = 'daily';
    if (!item.startDate) item.startDate = td;
    if (!item.daysOfWeek) item.daysOfWeek = [0,2,4];
    if (!num(item.everyDays)) item.everyDays = 3;
  });
  s.pr.forEach(p => {
    if (!p.cr) p.cr = td;
    (p.days||[]).forEach(d => {
      (d.items||[]).forEach(it => {
        if (!Array.isArray(it.setDone)) it.setDone = Array.from({length: Math.max(1, num(it.s)||3)}, () => false);
      });
    });
  });
  return s;
}

let S = loadState();
let V = { tab: 'home', pIdx: -1, cat: 'الكل', q: '', sg: '', mo: '', report: '', backupText: '' };
let timerState = { rem: 0, total: 60, label: '', iv: null };
let toastTimer = null;

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

const dayTotals = () => S.day.eat.reduce((a,x)=>({
  k: a.k + num(x.k),
  p: a.p + num(x.p),
  f: a.f + num(x.f),
  h: a.h + num(x.h)
}), {k:0, p:0, f:0, h:0});

function save(){
  const td = todayStr();
  if (S.day.d !== td) {
    S.day = { d: td, eat: [], w: 0, s: {}, supDoneAllDate: '' };
  }
  const t = dayTotals();
  if (S.day.eat.length) {
    S.lf[td] = { k: Math.round(t.k), p: Math.round(t.p), f: Math.round(t.f), h: Math.round(t.h), i: S.day.eat.map(x => x.n) };
  } else {
    delete S.lf[td];
  }
  try { localStorage.setItem('yas_pro_v1', JSON.stringify(S)); } catch(e){ toast('تعذّر الحفظ — المساحة ممتلئة'); }
}

function commit(){ save(); render(); }
function setTab(t){ V.tab = t; V.pIdx = -1; V.report = ''; render(); }
function openProg(i){ V.tab = 'prog'; V.pIdx = i; V.report = ''; render(); }

function isSupDueOn(sup, dateStr = todayStr()){
  const start = sup.startDate || dateStr;
  const diff = daysDiff(dateStr, start);
  if (diff < 0) return false;
  if (sup.freq === 'daily') return true;
  if (sup.freq === 'eod') return diff % 2 === 0;
  if (sup.freq === 'weekly') {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const list = Array.isArray(sup.daysOfWeek) && sup.daysOfWeek.length ? sup.daysOfWeek : [0];
    return list.includes(dow);
  }
  if (sup.freq === 'custom') {
    const step = Math.max(1, num(sup.everyDays) || 1);
    return diff % step === 0;
  }
  return true;
}

function freqLabel(sup){
  if (sup.freq === 'daily') return 'كل يوم';
  if (sup.freq === 'eod') return 'يوم إي ويوم لا';
  if (sup.freq === 'weekly') {
    const names = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const arr = (sup.daysOfWeek||[]).map(d => names[d]).filter(Boolean);
    return 'أسبوعي (' + (arr.length ? arr.join('، ') : 'الأحد') + ')';
  }
  return 'كل ' + (num(sup.everyDays)||1) + ' أيام';
}

function startTimer(sec, label){
  clearInterval(timerState.iv);
  const s = Math.max(10, num(sec) || 60);
  timerState = {
    rem: s,
    total: s,
    label: label || 'راحة بين الجولات',
    iv: setInterval(() => {
      timerState.rem--;
      if (timerState.rem <= 0) {
        clearInterval(timerState.iv);
        timerState.rem = 0;
        toast('انتهى وقت الراحة! جاهز للجولة التالية 💪');
        try { if (navigator.vibrate) navigator.vibrate([160, 80, 160]); } catch(e){}
      }
      renderTimer();
    }, 1000)
  };
  renderTimer();
}

function addTimer(delta){
  if (!timerState.rem && delta < 0) return;
  timerState.rem = Math.max(0, timerState.rem + delta);
  if (timerState.rem === 0) { clearInterval(timerState.iv); timerState.iv = null; }
  renderTimer();
}

function stopTimer(){
  clearInterval(timerState.iv);
  timerState = { rem: 0, total: 60, label: '', iv: null };
  renderTimer();
}

function renderTimer(){
  const box = $('#timerFloat');
  if (!timerState.rem) { box.innerHTML = ''; return; }
  const m = String(Math.floor(timerState.rem / 60)).padStart(2,'0');
  const sec = String(timerState.rem % 60).padStart(2,'0');
  box.innerHTML = `<div class="timer-bar">
    <div><div style="font-size:11px;opacity:.8">${esc(timerState.label)}</div><b>${m}:${sec}</b></div>
    <div class="row-wrap">
      <button class="sm x" onclick="addTimer(15)">+15ث</button>
      <button class="sm x" onclick="addTimer(-15)">-15ث</button>
      <button class="sm" onclick="stopTimer()">إيقاف</button>
    </div>
  </div>`;
}

const groupOf = n => (allExercises().find(x => x.n === n) || {}).g || 'صدر';
const calcPct = x => {
  if (!num(x.sr)) return 0;
  const cur = num(x.sw) ? num(x.w) * num(x.r) : num(x.r);
  const base = num(x.sw) ? num(x.sw) * num(x.sr) : num(x.sr);
  if (!base) return 0;
  return ((cur - base) / base) * 100;
};

    it.setDone = Array.from({length: target}, (_, i) => !!(it.setDone && it.setDone[i]));
  }
  if (!num(it.sw) && field === 'w' && num(it.w) > 0) {
    it.sw = it.w;
    it.sr = it.r;
  }
  if ('wrst'.includes(field)) {

function buildProgReport(pIdx, friendMode){
  const p = S.pr[pIdx];
  const elapsed = Math.max(1, daysDiff(todayStr(), p.cr) || 1);
  let sumPct = 0, cnt = 0, vol = 0;
  let out = `📋 ${p.name}\n` + (friendMode ? '' : `⏱ مدة الجدول: ${elapsed} يوم\n`);
  p.days.forEach(d => {
    out += `\n▪ ${d.n}\n`;
    (d.items||[]).forEach(x => {
      const q = calcPct(x);
      if (num(x.sr)) { sumPct += q; cnt++; }
      vol += num(x.s) * num(x.r) * num(x.w);
      out += ` - ${x.e}: ${x.s}×${x.r}${x.ss?' (سوبر سيت)':''}` +
        (friendMode ? '' : ` | ${x.w}كغ (بداية ${x.sw||0}كغ) | ${q>=0?'+':''}${q.toFixed(0)}%`) + '\n';
    });
  });
  if (!friendMode) {
    out += `\n🏋️ الحجم الإجمالي المسجل: ${Math.round(vol).toLocaleString()} كغ`;
    if (cnt) out += `\n📈 متوسط التحسن: ${(sumPct / cnt).toFixed(0)}%`;
  }
  V.report = out;
  render();
}

async function copyOrShareReport(){
  try { await navigator.share({ text: V.report }); return; } catch(e){}
  try { await navigator.clipboard.writeText(V.report); toast('تم نسخ التقرير ✅'); return; } catch(e){}

function smartSuggest(){
  const t = dayTotals();
  let remP = Math.max(0, num(S.goal.p) - t.p);
  let remK = Math.max(0, num(S.goal.k) - t.k);
  if (remP <= 2 && remK <= 20) {
    V.sg = '🎉 ممتاز! أنجزت أهداف السعرات والبروتين لليوم.';
    render();
    return;
  }
  const needProteinFirst = remP > 15;
  const picks = [];
  const pool = [...S.foods]
    .filter(x => x.k > 0 && x.k <= remK + 120)
    .sort((a,b) => needProteinFirst ? ((b.p/(b.k||1)) - (a.p/(a.k||1))) : (b.k - a.k));
  for (const f of pool) {
    if (picks.length >= 4) break;
    if (remK < 35 && f.k > remK + 20) continue;
    const rawQty = needProteinFirst ? (remP / Math.max(1, f.p)) : (remK / Math.max(1, f.k));
    const qty = Math.max(0.5, Math.min(3, Math.round(rawQty * 2) / 2));
    if (qty * f.k <= remK + 80) {
      picks.push(`${qty} ${f.u} ${f.n}`);
      remP = Math.max(0, remP - qty * f.p);
      remK = Math.max(0, remK - qty * f.k);
    }
  }
  V.sg = picks.length ? '💡 مقترح لإكمال يومك: ' + picks.join(' ، ') : '💡 خيارات خفيفة متبقية تناسب باقي سعراتك اليوم.';
  render();
}

function saveBodyEntry(){
  const w = num($('#b_w').value);
  if (!w) { toast('أدخل الوزن أولاً'); return; }
  S.body.push({
    d: $('#b_d').value || todayStr(),
    w,
    fat: num($('#b_fat').value) || null,
    mus: num($('#b_mus').value) || null,
    wst: num($('#b_wst').value) || null
  });
  S.body.sort((a,b) => a.d.localeCompare(b.d));
  closeModal();
  commit();
  toast('تم تسجيل قياس الجسم ✅');
}

function exportJson(){ V.backupText = JSON.stringify(S, null, 2); render(); }
function downloadJson(){
  const txt = V.backupText || JSON.stringify(S, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
  a.download = `yas-backup-${todayStr()}.json`;
  a.click();
  toast('تم تنزيل ملف النسخة الاحتياطية');
}
async function copyJson(){
  const txt = V.backupText || JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(txt); toast('تم نسخ البيانات ✅'); } catch(e){ toast('حدّث المربع وانسخه يدوياً'); }
}
function importJsonText(raw){
  try {
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.foods) || !Array.isArray(obj.pr)) throw new Error('bad');
    if (!confirm('استبدال البيانات الحالية بالنسخة المستوردة؟')) return;
    localStorage.setItem('yas_pro_v1', JSON.stringify(obj));
    S = loadState();
    V.backupText = '';
    render();
    toast('تم استيراد البيانات بنجاح ✅');
  } catch(e){ toast('صيغة النسخة غير صحيحة'); }
}

function renderHome(){
  const t = dayTotals();
  const g = S.goal;
  const workoutDates = [...new Set(S.lw.map(x => x.d))].sort();
  const td = todayStr();

  let streak = 0, idx = workoutDates.includes(td) ? 0 : 1;
  while (workoutDates.includes(todayStr(idx))) { streak++; idx++; }

  let bestStreak = 0, run = 0, prev = null;
  workoutDates.forEach(d => {
    run = (prev && daysDiff(d, prev) === 1) ? run + 1 : 1;
    if (run > bestStreak) bestStreak = run;
    prev = d;
  });

  const dueSups = S.sup.filter(s => isSupDueOn(s));
  const pendingSups = dueSups.filter(s => !isSupTakenToday(s));
  const alerts = [];
  if (pendingSups.length) {
    alerts.push({ txt: `💊 باقي ${pendingSups.length} حبة/مكمل مستحق اليوم: ${pendingSups.map(x=>x.n).join('، ')}`, tab: 'sup' });
  } else if (dueSups.length) {
    alerts.push({ txt: `✅ أنجزت جميع مكملات اليوم (${dueSups.length})`, tab: 'sup' });
  }
  if (num(S.day.w) < num(S.wg)) {
    const remW = +(num(S.wg) - num(S.day.w)).toFixed(2);
    alerts.push({ txt: `💧 باقي ${remW} لتر ماء للوصول لهدف اليوم (${S.wg} ل)`, tab: 'sup' });
  }

  const activeProg = S.pr.find(p => p.act);

    'linear-gradient(135deg,#7c3aed,#ec4899)',
    'linear-gradient(135deg,#f97316,#eab308)',

    'linear-gradient(135deg,#059669,#10b981)'

  const latestBody = S.body[S.body.length - 1];
  const prevBody = S.body.length > 1 ? S.body[S.body.length - 2] : null;
  const wDiff = latestBody && prevBody ? +(latestBody.w - prevBody.w).toFixed(1) : null;

  const dayNames = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

        <div class="prog-head"><span>السعرات</span><span>${Math.round(t.k)} / ${g.k}</span></div>

      </div>

        <div class="prog-bar ${t.p>=g.p?'ok':''}"><i style="width:${Math.min(100,t.p/(g.p||1)*100)}%"></i></div>
      </div>
      <div class="muted" style="margin-top:8px">كارب: ${Math.round(t.h)}غ · دهون: ${Math.round(t.f)}غ</div>
    </div>

    ${activeProg ? `
      <div class="card" style="background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0">
        <div class="row">
          <div>
            <div style="font-size:11px;opacity:.9">⭐ الجدول التدريبي المعتمد</div>
            <b style="font-size:16px">${esc(activeProg.name)}</b>
          </div>
          <button style="background:#fff;color:var(--o)" class="sm" onclick="openProg(${S.pr.indexOf(activeProg)})">فتح التمرين</button>
        </div>
      </div>
    ` : ''}

    <div class="sec-title">الجداول التدريبية <span class="link" onclick="setTab('prog')">الكل ‹</span></div>
    <div class="hscroll">
      ${S.pr.length ? S.pr.map((p, i) => {
        const items = (p.days||[]).flatMap(d => d.items||[]).filter(x => num(x.sr) > 0);
        const avg = items.length ? Math.round(items.reduce((a,b)=>a+calcPct(b),0)/items.length) : 0;
        return `<div class="pcard" style="background:${grads[i%grads.length]}" onclick="openProg(${i})">

    <div class="sec-title">⚖️ سجل قياسات الجسم <span class="link" onclick="openBodySheet()">+ قياس</span></div>

      ${S.body.length ? S.body.slice(-4).reverse().map(b => `

        </div>

    </div>

    <div class="sec-title">💾 النسخ الاحتياطي</div>

      <div class="row-wrap" style="margin-bottom:8px">

          <div class="muted" style="margin-top:2px">${f.k} سعرة · بروتين ${f.p}غ · كارب ${f.h}غ · دهون ${f.f}غ</div>
        </div>
        <div class="row-wrap">
          <button class="sm" onclick="quickEat(${idx},1)" title="إضافة وحدة واحدة">+1</button>
          <button class="sm x" onclick="openAddFoodSheet(${idx},1)" title="تحديد كمية أو تعديل">كمية / ✎</button>
        </div>
      </div>
    `).join('')}
  `;
}

function renderSup(){
  const td = todayStr();
  const dueList = S.sup.filter(s => isSupDueOn(s, td));
  const restList = S.sup.filter(s => !isSupDueOn(s, td));
  const takenCount = dueList.filter(s => isSupTakenToday(s)).length;
  const allDueDone = dueList.length > 0 && takenCount === dueList.length;

  const remWater = Math.max(0, +(num(S.wg) - num(S.day.w)).toFixed(2));

  return `
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <h2 style="margin:0">💊 المكملات والحبوب</h2>
        <button class="sm" onclick="openSupSheet()">+ إضافة مكمل</button>
      </div>
      <div class="muted" style="margin-bottom:10px">
        مستحق اليوم: <b>${takenCount} / ${dueList.length}</b> · يُحسب الجدول تلقائياً حسب الفترة المختارة لكل حبة
      </div>

      ${dueList.length ? `
        <div class="row-wrap" style="margin-bottom:8px">
          <button class="ok ${allDueDone?'x':''}" style="flex:1" onclick="${allDueDone?'uncompleteAllSupsToday()':'completeAllDueSupsToday()'}">
            ${allDueDone ? '✓ تم إنجاز مكملات اليوم (إلغاء؟)' : '✅ تم إنجاز اليوم لمكملات اليوم'}
          </button>
        </div>
      ` : ''}

      ${dueList.map(s => {
        const idx = S.sup.indexOf(s);
        const taken = isSupTakenToday(s);
        return `<div class="card-soft row" style="${taken?'background:#f0fdf4;border-color:#bbf7d0':''}">
          <label style="display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer">
            <input type="checkbox" ${taken?'checked':''} onchange="toggleSup('${s.id}')" style="width:18px;height:18px;margin-top:2px">
            <div>
              <b>${esc(s.n)}</b> ${s.d ? `<span class="muted">(${esc(s.d)})</span>` : ''}
              <div style="margin-top:4px">
                <span class="pill-status ${taken?'st-ok':'st-due'}">${taken?'✓ أُخذ اليوم':'اليوم لازم تاخذها'}</span>
                <span class="muted" style="margin-right:6px">${esc(freqLabel(s))}</span>
              </div>
            </div>
          </label>
          <button class="sm x" onclick="S.sup.splice(${idx},1);commit()">✕</button>
        </div>`;
      }).join('')}

      ${restList.length ? `
        <div class="muted" style="margin:12px 0 6px;font-weight:700">غير مستحقة اليوم حسب الجدول</div>
        ${restList.map(s => {
          const idx = S.sup.indexOf(s);
          return `<div class="card-soft row" style="opacity:.78">
            <div>
              <b>${esc(s.n)}</b> ${s.d ? `<span class="muted">(${esc(s.d)})</span>` : ''}
              <div style="margin-top:4px">
                <span class="pill-status st-rest">اليوم مو موعدها</span>
                <span class="muted" style="margin-right:6px">${esc(freqLabel(s))}</span>
              </div>
            </div>
            <button class="sm x" onclick="S.sup.splice(${idx},1);commit()">✕</button>
          </div>`;
        }).join('')}
      ` : ''}

      ${!S.sup.length ? '<div class="muted">لا توجد حبوب أو مكملات مضافة بعد. اضغط «+ إضافة مكمل» لتحديد الجرعة والفترة (كل يوم، يوم إي يوم لا، كل أسبوع...).</div>' : ''}
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <h3 style="margin:0">💧 تتبع الماء</h3>
        <span class="muted">${remWater > 0 ? `باقي ${remWater} لتر` : 'تم تحقيق الهدف ✅'}</span>
      </div>
      <div class="row-wrap" style="margin-bottom:8px">
        <b style="font-size:18px">${num(S.day.w)}</b>
        <span class="muted">من</span>
        <input type="number" step="0.5" min="0.5" value="${S.wg}" style="width:76px" onchange="S.wg=num(this.value)||3;commit()">
        <span class="muted">لتر</span>
      </div>
      <div class="row-wrap">
        <button class="sm" onclick="S.day.w=+(num(S.day.w)+0.25).toFixed(2);commit()">+0.25 ل</button>
        <button class="sm" onclick="S.day.w=+(num(S.day.w)+0.5).toFixed(2);commit()">+0.5 ل</button>
        <button class="sm x" onclick="S.day.w=Math.max(0,+(num(S.day.w)-0.25).toFixed(2));commit()">-0.25 ل</button>
      </div>
      <div class="prog-bar ${num(S.day.w)>=num(S.wg)?'ok':''}" style="margin-top:10px">
        <i style="width:${Math.min(100,num(S.day.w)/(num(S.wg)||1)*100)}%"></i>
      </div>
    </div>
  `;
}

function renderLog(){
  const months = [...new Set([
    ...S.lw.map(x => (x.d||'').slice(0,7)),
    ...Object.keys(S.lf).map(d => d.slice(0,7)),
    todayStr().slice(0,7)
  ])].filter(Boolean).sort().reverse();

  const curMo = V.mo || months[0];
  const foodDays = Object.keys(S.lf).filter(d => d.slice(0,7) === curMo).sort().reverse();
  const workRows = S.lw.map((x, idx) => ({ x, idx })).filter(({ x }) => (x.d||'').slice(0,7) === curMo).reverse();

  return `
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">📈 السجل التاريخي</h2>
      <div class="row-wrap">
        <button class="sm x" onclick="clearMonthLog('${curMo}')">مسح الشهر</button>
        <button class="sm x" onclick="clearAllLog()">مسح الكل</button>
      </div>
    </div>

    <div class="chips">
      ${months.map(m => `<button class="chip ${m===curMo?'on':''}" onclick="V.mo='${m}';render()">${m}</button>`).join('')}
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">🍽️ سجل الأكل</h3>
      ${foodDays.length ? foodDays.map(d => {
        const info = S.lf[d];
        return `<div class="card-soft">
          <b>${esc(d)}</b> · <span style="color:var(--o);font-weight:700">${info.k} سعرة</span> · بروتين ${info.p}غ
          <div class="muted" style="margin-top:2px">${(info.i||[]).map(esc).join('، ')}</div>
        </div>`;
      }).join('') : '<div class="muted">لا توجد سجلات أكل في هذا الشهر.</div>'}
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">🏋️ سجل التمارين</h3>
      ${workRows.length ? workRows.map(({ x, idx }) => `
        <div class="card-soft row">
          <div>
            <b>${esc(x.e)}</b> <span class="muted">· ${esc(x.d)}</span>
            <div class="muted">${x.s} جولات × ${x.r} عدات · وزن ${x.w} كغ ${x.n ? `· 📝 ${esc(x.n)}` : ''}</div>
          </div>
          <button class="sm x" onclick="S.lw.splice(${idx},1);commit()">✕</button>
        </div>
      `).join('') : '<div class="muted">لا توجد تمارين مسجلة في هذا الشهر.</div>'}
    </div>
  `;
}

function clearMonthLog(mo){
  if (!confirm(`مسح سجلات شهر ${mo}؟`)) return;
  S.lw = S.lw.filter(x => (x.d||'').slice(0,7) !== mo);
  Object.keys(S.lf).forEach(d => { if (d.slice(0,7) === mo) delete S.lf[d]; });
  if (todayStr().slice(0,7) === mo) S.day.eat = [];
  commit();
}

function clearAllLog(){
  if (!confirm('مسح جميع سجلات التمارين والأكل؟')) return;
  S.lw = [];
  S.lf = {};
  S.day.eat = [];
  commit();
}

function render(){
  save();
  const views = {
    home: renderHome,
    prog: () => V.pIdx >= 0 ? renderProgDetail() : renderProgList(),
    food: renderFood,
    sup: renderSup,
    log: renderLog
  };
  $('#app').innerHTML = `
    <div class="topbar">
      <h1 class="brand">Y.A.S</h1>
      <span class="sub-badge">${todayStr()}</span>
    </div>
    ${(views[V.tab] || renderHome)()}
  `;

  const navItems = [
    ['home','🏠','الرئيسية'],
    ['prog','📋','الجداول'],
    ['food','🍽️','الأكل'],
    ['sup','💊','المكملات'],
    ['log','📈','السجل']
  ];
  $('#nv').innerHTML = navItems.map(([k, ic, lbl]) => `
    <button class="${V.tab===k?'on':''}" onclick="setTab('${k}')">
      <span style="font-size:17px">${ic}</span>
      <span>${lbl}</span>
    </button>
  `).join('');
  renderTimer();
}

render();
</script>
</body>
</html>
