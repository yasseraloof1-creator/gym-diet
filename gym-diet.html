<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),N=v=>parseFloat(v)||0;

const DX=`فواكه|عنب|100غ|69|.7|.2|18;فواكه|بطيخ|100غ|30|.6|.2|8;فواكه|مانجو|100غ|60|.8|.4|15;فواكه|فراولة|100غ|32|.7|.3|8;فواكه|أناناس|100غ|50|.5|.1|13;فواكه|رمان|حبة|230|4.7|3.3|52;فواكه|كيوي|حبة|42|.8|.4|10;فواكه|أفوكادو|حبة|240|3|22|13;فواكه|توت أزرق|100غ|57|.7|.3|14;خضار|جزر|حبة|25|.6|.1|6;خضار|خس|100غ|15|1.4|.2|3;خضار|بروكلي|100غ|34|2.8|.4|7;خضار|بطاطا مسلوقة|100غ|87|1.9|.1|20;خضار|بطاطا حلوة|100غ|86|1.6|.1|20;خضار|سبانخ|100غ|23|2.9|.4|4;خضار|فلفل رومي|حبة|30|1|.3|7;خضار|كوسا|100غ|17|1.2|.3|3;خضار|ذرة|كوب|130|5|2|29;تمر|تمر عجوة|تمرة|60|.5|0|16;تمر|تمر مجدول|تمرة|66|.4|0|18;تمر|تمر|100غ|280|2.5|.4|75;تمر|معمول تمر|قطعة|120|1.5|4|20;حليب|حليب قليل الدسم|كوب|100|8|2.5|12;حليب|لبن|كوب|100|6|3|8;حليب|لبنة|ملعقة|35|1.5|3|1;حليب|جبنة بيضاء|100غ|264|14|21|4;حليب|جبنة شيدر|شريحة|70|4|6|.5;حليب|جبنة قريش|100غ|98|11|4|3;حليب|بروتين شيك|سكوب|120|24|1.5|3;حليب|زبادي يوناني|علبة|130|17|1|8;لحوم|فخذ دجاج|100غ|210|26|11|0;لحوم|لحم غنم|100غ|294|25|21|0;لحوم|كبدة|100غ|135|20|4|4;لحوم|سلمون|100غ|208|20|13|0;لحوم|روبيان|100غ|99|24|.3|.2;لحوم|بياض بيضة|حبة|17|3.6|0|.2;لحوم|ديك رومي|100غ|135|30|1|0;لحوم|برجر لحم|قطعة|250|17|17|9;حلويات|كوكيز|حبة|150|2|7|20;حلويات|بقلاوة|قطعة|200|3|11|23;حلويات|آيس كريم|كرة|140|2.5|7|17;حلويات|معمول|قطعة|130|1.5|6|18;حلويات|دونات|حبة|250|3|14|30;حلويات|كيكة|قطعة|300|4|15|38;حلويات|عسل|ملعقة|64|0|0|17;حلويات|سكر|ملعقة صغيرة|16|0|0|4;حلويات|قطايف|قطعة|180|3|8|25;مخبوزات|كرواسون|حبة|230|5|12|26;مخبوزات|صامولي|حبة|150|5|2|28;مخبوزات|مناقيش زعتر|قطعة|300|8|12|40;مخبوزات|فطيرة جبنة|قطعة|250|8|13|25;مخبوزات|شوفان|40غ|150|5|3|27;مخبوزات|كورن فليكس|كوب|100|2|0|24;مخبوزات|خبز أسمر|شريحة|70|3|1|12;مطبوخ|عدس مطبوخ|طبق|230|18|1|40;مطبوخ|مندي دجاج|طبق|700|40|25|75;مطبوخ|كبسة|طبق|650|35|22|75;مطبوخ|شاورما|ساندويتش|550|28|28|45;مطبوخ|فلافل|حبة|57|2.3|3|5;مطبوخ|مقلوبة|طبق|600|30|22|70;مطبوخ|بطاطس مقلية|100غ|312|3.4|15|41;مطبوخ|بيتزا|شريحة|285|12|10|36;مطبوخ|فتة|طبق|500|20|20|55`.split(';').map(s=>{const a=s.split('|');return{g:a[0],n:a[1],u:a[2],k:+a[3],p:+a[4],f:+a[5],h:+a[6]}});
let S;try{S=JSON.parse(localStorage.getItem('yas'))}catch(x){}
S=S||{};S.ex=S.ex||[];S.pr=S.pr||[];S.last=S.last||{};S.mn=S.mn||{};S.lw=S.lw||[];S.lf=S.lf||{};S.sup=S.sup||[];S.goal=S.goal||{k:2500,p:150};S.wg=S.wg||3;S.foods=S.foods||DF;if(S.fv!==2){DX.forEach(f=>{if(!S.foods.some(x=>x.n==f.n&&x.g==f.g))S.foods.push(f)});S.fv=2}
if(!S.day||S.day.d!==D())S.day={d:D(),eat:[],w:0,s:{}};
let V={t:'h',p:-1,c:'الكل',r:'',sg:'',mo:''};
const tot=()=>S.day.eat.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,f:a.f+x.f,h:a.h+x.h}),{k:0,p:0,f:0,h:0});
const sv=()=>{const t=tot();if(S.day.eat.length)S.lf[D()]={...t,i:S.day.eat.map(x=>x.n)};else delete S.lf[D()];try{localStorage.setItem('yas',JSON.stringify(S))}catch(x){}};
const S0=()=>{sv();R()};
const allEx=()=>Object.entries(DE).flatMap(([g,l])=>l.map(n=>({n,g}))).concat(S.ex);
const gOf=n=>(allEx().find(x=>x.n==n)||{}).g;
const pct=x=>!x.sr?0:(x.sw?(x.w*x.r)/(x.sw*x.sr):x.r/x.sr)*100-100;
const bar=(n,v,m)=>`<div class=c>${n}: ${Math.round(v)} / ${m}<div class=b><i style="width:${Math.min(100,v/(m||1)*100)}%"></i></div></div>`;
function go(t){V.t=t;V.p=-1;V.r='';V.x='';R()}
function op(i){V.t='p';V.p=i;V.r='';R()}
// ---- programs
function np(){const n=prompt('اسم الجدول (مثلا: ارنولد)');if(n){S.pr.push({name:n,days:[],cr:D()});S0()}}
function rn(){const p=S.pr[V.p],n=prompt('اسم جديد',p.name);if(n){p.name=n;S0()}}
function dp(){if(confirm('حذف الجدول؟')){S.pr.splice(V.p,1);go('p');sv()}}
function act(){const p=S.pr[V.p],w=p.act;S.pr.forEach(q=>q.act=false);p.act=!w;S0()}
function ad(){const n=prompt('اسم اليوم');if(n){S.pr[V.p].days.push({n,items:[]});S0()}}
function dd(i){if(confirm('حذف اليوم؟')){S.pr[V.p].days.splice(i,1);S0()}}
function ae(d){const sel=$('#sx'+d).value,nw=$('#nx'+d).value.trim();let n=sel,g=gOf(sel);if(nw){n=nw;g=gOf(nw)||$('#gx'+d).value;if(!gOf(nw))S.ex.push({n:nw,g})}if(!n)return;const l=S.last[n]||{};S.pr[V.p].days[d].items.push({e:n,g,s:l.s||3,r:l.r||10,w:l.w||0,t:l.t||60,sw:l.w||0,sr:l.r||10});S0()}
const X=(d,k)=>S.pr[V.p].days[d].items[k];
function up(d,k,f,v){const x=X(d,k);x[f]=N(v);if(!x.sw&&f=='w'&&x.w){x.sw=x.w;x.sr=x.r}if('wrst'.includes(f))S.last[x.e]={s:x.s,r:x.r,w:x.w,t:x.t};S0()}
function dn(d,k){const x=X(d,k),n=prompt('ملاحظة (اختياري)','');if(n===null)return;x.done=D();x.n=n||x.n;S.lw.push({d:D(),p:S.pr[V.p].name,y:S.pr[V.p].days[d].n,e:x.e,w:x.w,s:x.s,r:x.r,n:n||''});S.last[x.e]={s:x.s,r:x.r,w:x.w,t:x.t};S0()}
function rs(d,k){const x=X(d,k);if(confirm('بدء دورة جديدة: الوزن الحالي يصير نقطة البداية ونسبة التقدم ترجع من صفر؟')){x.sw=x.w;x.sr=x.r;S0()}}
function mv(d,k,s){const a=S.pr[V.p].days[d].items,j=k+s;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];S0()}
function ssf(d,k){X(d,k).ss=!X(d,k).ss;S0()}
function mn(n){const v=prompt('ملاحظة الجهاز (ارتفاع الكرسي...)',S.mn[n]||'');if(v!==null){S.mn[n]=v;S0()}}
function rm(d,k){S.pr[V.p].days[d].items.splice(k,1);S0()}
function rp(sh){const p=S.pr[V.p],days=Math.max(1,Math.round((new Date(D())-new Date(p.cr))/864e5));let t=0,c=0,o=`📋 ${p.name}\n`+(sh?'':`⏱ ${days} يوم\n`);p.days.forEach(d=>{o+=`\n▪ ${d.n}\n`;d.items.forEach(x=>{const q=pct(x);if(x.sr){t+=q;c++}o+=` - ${x.e}: ${x.s}×${x.r}${x.ss?' (سوبر سيت)':''}`+(sh?'':` | ${x.w}كغ (بدأ ${x.sw}كغ) | ${q>=0?'+':''}${q.toFixed(0)}%`)+'\n'})});if(!sh&&c)o+=`\n📈 متوسط التحسن: ${(t/c).toFixed(0)}%`;V.r=o;R()}
async function sh(){try{await navigator.share({text:V.r})}catch(x){try{await navigator.clipboard.writeText(V.r);alert('تم النسخ')}catch(y){const t=$('#rt');t.select();document.execCommand('copy')}}}
const it=(x,d,k)=>{const c=G[x.g]||'#999',q=pct(x);return `<div class=c style="background:${c}22;border-right:4px solid ${c}"><div class=r><b>${e(x.e)} ${x.ss?'🔗':''} ${x.done==D()?'✅':''}</b><span class=pc>${q>=0?'+':''}${q.toFixed(0)}%</span></div>
<div class=g><label>جولات<input type=number value="${x.s}" onchange="up(${d},${k},'s',this.value)"></label><label>عدات<input type=number value="${x.r}" onchange="up(${d},${k},'r',this.value)"></label><label>وزن<input type=number value="${x.w}" onchange="up(${d},${k},'w',this.value)"></label><label>راحة(ث)<input type=number value="${x.t}" onchange="up(${d},${k},'t',this.value)"></label></div>
<small>بدأت: ${x.sw||0}كغ×${x.sr||0}${S.mn[x.e]?' | 🛠 '+e(S.mn[x.e]):''}${x.n?' | 📝 '+e(x.n):''}</small><div><button onclick="dn(${d},${k})">تم ✓</button><button class=x onclick="rs(${d},${k})">🔄</button><button class=x onclick="ssf(${d},${k})">🔗</button><button class=x onclick="mn('${e(x.e).replace(/'/g,'')}')">🛠</button><button class=x onclick="mv(${d},${k},-1)">↑</button><button class=x onclick="mv(${d},${k},1)">↓</button><button class=x onclick="rm(${d},${k})">✕</button></div></div>`};
function pv(){const p=S.pr[V.p],all=allEx(),gs=Object.keys(G);return `<h2>${e(p.name)} ${p.act?'⭐':''}</h2><div><button onclick="act()">${p.act?'إلغاء الاعتماد':'اعتماد الجدول'}</button><button class=x onclick="rn()">✎</button><button onclick="rp(0)">📊 تقرير</button><button onclick="rp(1)">📤 للصديق</button><button class=x onclick="dp()">🗑</button></div>`+(V.r?`<textarea id=rt readonly rows=10 style="width:100%">${e(V.r)}</textarea><button onclick="sh()">مشاركة / نسخ</button>`:'')+p.days.map((d,i)=>`<h3>${e(d.n)} <button class=x onclick="dd(${i})">🗑</button></h3>`+d.items.map((x,k)=>it(x,i,k)).join('')+`<div class=c><select id=sx${i}>${gs.map(g=>`<optgroup label="${g}">${all.filter(x=>x.g==g).map(x=>`<option>${e(x.n)}</option>`).join('')}</optgroup>`).join('')}</select> <input id=nx${i} placeholder="تمرين جديد" size=9><select id=gx${i}>${gs.map(g=>`<option>${g}</option>`).join('')}</select><button onclick="ae(${i})">+ إضافة</button></div>`).join('')+`<button onclick="ad()">+ يوم جديد</button>`}
