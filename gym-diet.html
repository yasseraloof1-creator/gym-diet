<style>
:root{
  color-scheme:light;
  --bg:#f2f4fa;
  --c:#ffffff;
  --c2:#f8f9fd;
  --t:#1a1e36;
  --m:#6e7594;
  --o:#7c3aed;
  --o2:#db2777;
  --ok:#10b981;
  --wn:#f59e0b;
  --bd:#e4e7f2;
  --i:#f1f3f9;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding-bottom:88px;min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--t)}
button{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;transition:transform .12s ease,opacity .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.x{background:var(--i);color:var(--t);border:1px solid var(--bd);font-weight:500}
button.ok{background:var(--ok);color:#fff}
button.sm{padding:5px 10px;font-size:12px;border-radius:9px}
input,select,textarea{background:var(--i);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--o);background:#fff}
label.lbl{display:block;font-size:11px;color:var(--m);margin-bottom:3px;font-weight:600}

#app{max-width:680px;margin:0 auto;padding:12px 14px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:0;z-index:20;background:rgba(242,244,250,.92);backdrop-filter:blur(10px);padding:8px 2px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.brand{font-size:20px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,var(--o),var(--o2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}
.sub-badge{font-size:11px;color:var(--m);background:var(--c);border:1px solid var(--bd);padding:4px 10px;border-radius:99px;font-weight:600}

.card{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card-soft{background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-size:15px;font-weight:700}
.sec-title span.link{font-size:12px;color:var(--o);cursor:pointer;font-weight:600}
.muted{color:var(--m);font-size:12px}

.prog-wrap{margin-top:6px}
.prog-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;font-weight:600}
.prog-bar{height:8px;background:var(--i);border-radius:99px;overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .25s ease}
.prog-bar.ok i{background:linear-gradient(90deg,#10b981,#059669)}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 76%;scroll-snap-align:start;border-radius:20px;padding:15px;color:#fff;box-shadow:var(--sh-lg);position:relative;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}

.pcard small{opacity:.92;font-size:12px}
.pcard .prog-bar{background:rgba(255,255,255,.28);height:6px;margin-top:8px}
.pcard .prog-bar i{background:#fff}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:13px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh)}
.stat-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat-box b{display:block;font-size:17px;line-height:1.2}
.stat-box small{color:var(--m);font-size:11.5px}

function makeSets(count, reps, weight, oldDoneArr){
  const n = Math.max(1, Math.min(12, Math.round(num(count) || 3)));
  const r = num(reps) || 10;
  const w = num(weight) || 0;
  return Array.from({length: n}, (_, i) => ({
    r,
    w,
    done: !!(oldDoneArr && oldDoneArr[i])
  }));
}

// متوسط الوزن عبر الجولات — أساس نسبة التقدم (الوزن فقط، بدون العدات)
function avgW(sets){
  if (!sets || !sets.length) return 0;
  return sets.reduce((a, s) => a + num(s.w), 0) / sets.length;
}

function normalizeExItem(it){
  const count = Math.max(1, Math.min(12, Math.round(num(it.s) || (Array.isArray(it.sets) ? it.sets.length : 3))));
  if (!Array.isArray(it.sets) || !it.sets.length) {
    it.sets = makeSets(count, it.r, it.w, it.setDone);
    // ترحيل عدات الجولات من النسخة القديمة (rs)
    if (Array.isArray(it.rs)) it.sets.forEach((st, i) => { if (it.rs[i] != null) st.r = num(it.rs[i]); });
  } else {
    it.sets = it.sets.map(st => ({
      r: num(st.r),
      w: num(st.w),
      done: !!st.done
    }));
  }
  it.s = it.sets.length;

  // مجموعة السوبر سيت: '' | '1'..'4'
  if (it.ss === true) it.ss = '1';
  else if (!it.ss || it.ss === '0') it.ss = '';
  else {
    const n = Math.round(num(it.ss));
    it.ss = n >= 1 && n <= 4 ? String(n) : (n > 4 ? '4' : '');
  }

  // وزن البداية لحساب التقدم
  if (it.baseW == null) {
    if (num(it.sw) > 0) it.baseW = num(it.sw);
    else if (num(it.baseVol) > 0) {
      const sr = it.sets.reduce((a, s) => a + num(s.r), 0);
      it.baseW = sr ? +(num(it.baseVol) / sr).toFixed(2) : avgW(it.sets);
    } else it.baseW = avgW(it.sets);
  }
}

// تصفير علامات الجولات إذا كانت من يوم سابق
function resetStaleSets(st){
  const td = todayStr();
  (st.pr || []).forEach(p => (p.days || []).forEach(d => (d.items || []).forEach(it => {
    if (it.sd !== td && Array.isArray(it.sets)) it.sets.forEach(s => { s.done = false; });
  })));
}

function loadState(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem('yas_pro_v2') || localStorage.getItem('yas_pro_v1') || localStorage.getItem('yas') || 'null'); } catch(e){}
  const s = raw || {};
  s.ex = Array.isArray(s.ex) ? s.ex : [];
  s.pr = Array.isArray(s.pr) ? s.pr : [];
  s.last = s.last && typeof s.last === 'object' ? s.last : {};
  s.mn = s.mn && typeof s.mn === 'object' ? s.mn : {};
  s.gmap = s.gmap && typeof s.gmap === 'object' ? s.gmap : {};
  s.lw = Array.isArray(s.lw) ? s.lw : [];
  { const seen = {}; s.lw.forEach(x => { seen[x.d + '|' + x.p + '|' + x.y + '|' + x.e] = x; }); s.lw = Object.values(seen); }
  s.lf = s.lf && typeof s.lf === 'object' ? s.lf : {};
  s.sup = Array.isArray(s.sup) ? s.sup : [];
  s.body = Array.isArray(s.body) ? s.body : [];
  s.goal = s.goal && typeof s.goal === 'object' ? {k: num(s.goal.k)||2500, p: num(s.goal.p)||150} : {k:2500, p:150};
  s.wg = num(s.wg) || 3;
  s.foods = Array.isArray(s.foods) && s.foods.length ? s.foods : SEED_FOODS.map(x=>({...x}));
  if (s.fv !== 2) {
    SEED_FOODS.forEach(f => {
      if (!s.foods.some(x => x.n === f.n && x.g === f.g)) s.foods.push({...f});
    });
    s.fv = 2;
  }
  const td = todayStr();
  if (!s.day || s.day.d !== td) {
    s.day = { d: td, eat: [], w: 0, s: {} };
  } else {
    s.day.eat = Array.isArray(s.day.eat) ? s.day.eat : [];
    s.day.w = num(s.day.w);
    s.day.s = s.day.s && typeof s.day.s === 'object' ? s.day.s : {};
  }
  s.sup.forEach(item => {
    if (!item.id) item.id = 'sup_' + Math.random().toString(36).slice(2,8);
    // ترحيل من الصيغ القديمة
    if (item.iv && !item.freq) {
      item.freq = num(item.iv) <= 1 ? 'daily' : 'every';
      item.everyDays = num(item.iv) || 1;
      item.last = item.ls || '';
    }
    if (item.freq === 'eod') { item.freq = 'every'; item.everyDays = 2; }
    if (item.freq === 'custom') item.freq = 'every';
    if (!item.freq) item.freq = 'daily';
    if (!item.startDate) item.startDate = td;
    if (!Array.isArray(item.daysOfWeek) || !item.daysOfWeek.length) item.daysOfWeek = [0,2,4];
    if (!num(item.everyDays)) item.everyDays = 3;
    if (item.last == null) item.last = '';
  });
  s.pr.forEach(p => {
    if (!p.cr) p.cr = td;
    (p.days||[]).forEach(d => {
      (d.items||[]).forEach(normalizeExItem);
    });
  });
  resetStaleSets(s);
  return s;
}

// daily: كل يوم | weekly: أيام محددة | every: كل N يوم (تُحسب من آخر مرة أُخذت فيها)
function isSupDueOn(sup, dateStr = todayStr()){
  const diff = daysDiff(dateStr, sup.startDate || dateStr);
  if (diff < 0) return false;
  if (sup.freq === 'daily') return true;
  if (sup.freq === 'weekly') {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const list = Array.isArray(sup.daysOfWeek) && sup.daysOfWeek.length ? sup.daysOfWeek : [0];
    return list.includes(dow);
  }
  const step = Math.max(1, num(sup.everyDays) || 1);
  if (!sup.last || sup.last === dateStr) return true;
  return daysDiff(dateStr, sup.last) >= step;
}

function supDaysLeft(sup){
  if (sup.freq !== 'every' || !sup.last) return null;
  const step = Math.max(1, num(sup.everyDays) || 1);
  return Math.max(0, step - daysDiff(todayStr(), sup.last));
}

function freqLabel(sup){
  if (sup.freq === 'daily') return 'كل يوم';
  if (sup.freq === 'weekly') {
    const names = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const arr = (sup.daysOfWeek||[]).map(d => names[d]).filter(Boolean);
    return 'أسبوعي (' + (arr.length ? arr.join('، ') : 'الأحد') + ')';
  }
  const n = Math.max(1, num(sup.everyDays) || 1);
  const f = FREQS.find(x => x[1] === n);
  return f ? f[0] : 'كل ' + n + ' أيام';
}

    sup.last = todayStr();

// ---- Timer ----
function startTimer(sec, label){
  clearInterval(timerState.iv);
  const s = Math.max(10, num(sec) || 60);
  timerState = {
    rem: s,
    total: s,
    label: label || 'راحة بين الجولات',
    iv: setInterval(() => {
      timerState.rem--;
      if (timerState.rem <= 0) {
        clearInterval(timerState.iv);
        timerState.rem = 0;
        toast('انتهى وقت الراحة! جاهز للجولة التالية 💪');
        try { if (navigator.vibrate) navigator.vibrate([160, 80, 160]); } catch(e){}
      }
      renderTimer();
    }, 1000)
  };
  renderTimer();
}

function startTimerFor(pIdx, dIdx, kIdx){
  const it = S.pr[pIdx].days[dIdx].items[kIdx];

}

function addTimer(delta){
  if (!timerState.rem && delta < 0) return;
  timerState.rem = Math.max(0, timerState.rem + delta);
  if (timerState.rem === 0) { clearInterval(timerState.iv); timerState.iv = null; }
  renderTimer();
}

function stopTimer(){
  clearInterval(timerState.iv);
  timerState = { rem: 0, total: 60, label: '', iv: null };
  renderTimer();
}

function renderTimer(){
  const box = $('#timerFloat');
  if (!timerState.rem) { box.innerHTML = ''; return; }
  const m = String(Math.floor(timerState.rem / 60)).padStart(2,'0');
  const sec = String(timerState.rem % 60).padStart(2,'0');
  box.innerHTML = `<div class="timer-bar">
    <div><div style="font-size:11px;opacity:.8">${esc(timerState.label)}</div><b>${m}:${sec}</b></div>
    <div class="row-wrap">
      <button class="sm x" onclick="addTimer(15)">+15ث</button>
      <button class="sm x" onclick="addTimer(-15)">-15ث</button>

// نسبة التقدم من الوزن فقط (متوسط أوزان الجولات مقابل وزن البداية)
const calcPct = x => {
  normalizeExItem(x);
  const b = num(x.baseW);
  if (!b) return 0;
  return ((avgW(x.sets) - b) / b) * 100;
};

// ملخص كامل (مع الأوزان) — للاستخدام الشخصي
function formatSetsSummary(sets){
  if (!sets || !sets.length) return '';
  const allSameReps = sets.every(s => num(s.r) === num(sets[0].r));
  const allSameWeight = sets.every(s => num(s.w) === num(sets[0].w));
  if (allSameReps && allSameWeight) {
    return `${sets.length}×${sets[0].r} (${sets[0].w}كغ)`;
  }
  return sets.map((s, i) => `ج${i+1}: ${s.r}×${s.w}كغ`).join(' | ');
}

// ملخص بدون أوزان — لتقرير الصديق
function formatSetsRepsOnly(sets){
  if (!sets || !sets.length) return '';
  const allSame = sets.every(s => num(s.r) === num(sets[0].r));
  if (allSame) return `${sets.length}×${sets[0].r}`;
  return `${sets.length} جولات: ` + sets.map(s => s.r).join(' / ');
}

function pushExercise(pIdx, dIdx, name, g){

  if (!name) return false;

  const prev = S.last[name] || {};
  const initSets = Array.isArray(prev.sets) && prev.sets.length
    ? prev.sets.map(st => ({ r: num(st.r)||10, w: num(st.w)||0, done: false }))
    : makeSets(num(prev.s)||3, num(prev.r)||10, num(prev.w)||0);
  const items = S.pr[pIdx].days[dIdx].items;
  items.push({
    e: name, g,
    s: initSets.length,
    r: initSets[0].r,
    w: initSets[0].w,
    t: num(prev.t) || 60,
    sets: initSets,
    baseW: avgW(initSets),
    ss: '', done: '', n: ''
  });
  V.openDays[`${pIdx}_${dIdx}`] = true;
  V.openEx = { [`${pIdx}_${dIdx}_${items.length - 1}`]: true };
  return true;
}

function changeSetCount(pIdx, dIdx, kIdx, newCount){
  const it = S.pr[pIdx].days[dIdx].items[kIdx];
  normalizeExItem(it);
  const target = Math.max(1, Math.min(12, Math.round(num(newCount) || 1)));
  const lastSet = it.sets[it.sets.length - 1] || { r: 10, w: 0 };
  while (it.sets.length < target) {
    it.sets.push({ r: lastSet.r, w: lastSet.w, done: false });
  }
  if (it.sets.length > target) {
    it.sets.length = target;
  }
  it.s = target;
  S.last[it.e] = { s: it.s, r: it.sets[0].r, w: it.sets[0].w, t: it.t, sets: it.sets.map(x => ({r:x.r, w:x.w})) };
  commit();
}

function updateSingleSet(pIdx, dIdx, kIdx, setIdx, field, val){
  const p = S.pr[pIdx], day = p.days[dIdx];
  const it = day.items[kIdx];
  normalizeExItem(it);
  it.sets[setIdx][field] = num(val);
  // أول مرة يُدخل فيها وزن: يصبح هو وزن البداية
  if (!num(it.baseW) && avgW(it.sets) > 0) it.baseW = avgW(it.sets);
  it.r = it.sets[0].r;
  it.w = it.sets[0].w;
  S.last[it.e] = { s: it.s, r: it.r, w: it.w, t: it.t, sets: it.sets.map(x => ({r:x.r, w:x.w})) };
  // إذا التمرين مسجّل اليوم، حدّث السجل بالقيم الجديدة
  if (it.done === todayStr()) logExerciseToHistory(p, day, it, it.n);
  save();
  render();
}

function updateRestTime(pIdx, dIdx, kIdx, val){
  const it = S.pr[pIdx].days[dIdx].items[kIdx];
  it.t = Math.max(5, num(val) || 60);
  S.last[it.e] = { ...(S.last[it.e]||{}), t: it.t };
  save();

function logExerciseToHistory(p, day, it, note){
  const td = todayStr();
  // سجل واحد لكل (تاريخ + جدول + يوم + تمرين) حتى لا يتكرر
  const existingIdx = S.lw.findIndex(row => row.d === td && row.p === p.name && row.y === day.n && row.e === it.e);
  const record = {
    d: td,
    p: p.name,
    y: day.n,
    e: it.e,
    s: it.sets.length,
    r: it.sets[0] ? it.sets[0].r : 0,
    w: it.sets[0] ? it.sets[0].w : 0,
    sets: it.sets.map(st => ({ r: st.r, w: st.w })),
    n: note || it.n || ''
  };
  if (existingIdx >= 0) S.lw[existingIdx] = record;
  else S.lw.push(record);
}

function removeExerciseFromHistory(p, day, it){
  const td = todayStr();
  S.lw = S.lw.filter(row => !(row.d === td && row.p === p.name && row.y === day.n && row.e === it.e));
}

function toggleSetDone(pIdx, dIdx, kIdx, setIdx){
  const p = S.pr[pIdx];
  const day = p.days[dIdx];
  const it = day.items[kIdx];
  normalizeExItem(it);
  const wasDone = !!it.sets[setIdx].done;
  it.sets[setIdx].done = !wasDone;
  it.sd = todayStr();

  // إلغاء تحديد جولة: يرجع التمرين غير مكتمل ويُحذف من سجل اليوم
  if (wasDone) {
    if (it.done === todayStr()) {
      it.done = '';
      removeExerciseFromHistory(p, day, it);
    }
    commit();
    return;
  }

  if (num(it.t) > 0) {
    // شريك السوبر سيت: تمرين بنفس المجموعة لم يُكمل هذه الجولة بعد
    const partner = it.ss ? day.items.find((other, idx) => {
      if (idx === kIdx || other.ss !== it.ss) return false;
      normalizeExItem(other);
      return other.sets[setIdx] && !other.sets[setIdx].done;
    }) : null;
    if (partner) {
      toast(`🔗 سوبر سيت #${it.ss}: انتقل الآن إلى ${partner.e}`);
    } else {
      startTimer(it.t, `${it.e} — جولة ${setIdx+1}`);
    }
  }

  if (it.sets.every(st => st.done)) {
    it.done = todayStr();
    logExerciseToHistory(p, day, it, it.n);
    toast(`اكتمل تمرين ${it.e} وسُجّل لليوم ✅`);
  }
  commit();
}

function buildProgReport(pIdx, friendMode){
  const p = S.pr[pIdx];
  const elapsed = Math.max(1, daysDiff(todayStr(), p.cr) || 1);
  let sumPct = 0, cnt = 0, vol = 0;
  let out = `📋 ${p.name}\n` + (friendMode ? '' : `⏱ مدة الجدول: ${elapsed} يوم\n`);
  p.days.forEach(d => {
    out += `\n▪ ${d.n}\n`;
    (d.items||[]).forEach(x => {
      normalizeExItem(x);
      const q = calcPct(x);
      if (num(x.baseW) > 0) { sumPct += q; cnt++; }
      vol += x.sets.reduce((s, st) => s + num(st.r) * num(st.w), 0);
      // تقرير الصديق: جولات وعدات فقط، بدون أوزان ولا نسب
      const setsTxt = friendMode ? formatSetsRepsOnly(x.sets) : formatSetsSummary(x.sets);
      out += ` - ${x.e}${x.ss ? ` [سوبر سيت #${x.ss}]` : ''}: ${setsTxt}` +
        (friendMode ? '' : ` | التقدم: ${q>=0?'+':''}${q.toFixed(0)}%`) + '\n';
    });
  });
  if (!friendMode) {
    out += `\n🏋️ الحجم الإجمالي للجدول: ${Math.round(vol).toLocaleString()} كغ`;
    if (cnt) out += `\n📈 متوسط التحسن: ${(sumPct / cnt).toFixed(0)}%`;
  }
  V.report = out;
  render();
}

async function copyOrShareReport(){

  try { await navigator.clipboard.writeText(V.report); toast('تم نسخ التقرير ✅'); return; } catch(e){}

}

function smartSuggest(){
  const t = dayTotals();
  let remP = Math.max(0, num(S.goal.p) - t.p);
  let remK = Math.max(0, num(S.goal.k) - t.k);
  if (remP <= 2 && remK <= 20) {
    V.sg = '🎉 ممتاز! أنجزت أهداف السعرات والبروتين لليوم.';
    render();
    return;
  }
  const needProteinFirst = remP > 15;
  const picks = [];
  const pool = [...S.foods]
    .filter(x => x.k > 0 && x.k <= remK + 120)
    .sort((a,b) => needProteinFirst ? ((b.p/(b.k||1)) - (a.p/(a.k||1))) : (b.k - a.k));
  for (const f of pool) {
    if (picks.length >= 4) break;
    if (remK < 35 && f.k > remK + 20) continue;
    const rawQty = needProteinFirst ? (remP / Math.max(1, f.p)) : (remK / Math.max(1, f.k));
    const qty = Math.max(0.5, Math.min(3, Math.round(rawQty * 2) / 2));
    if (qty * f.k <= remK + 80) {
      picks.push(`${qty} ${f.u} ${f.n}`);
      remP = Math.max(0, remP - qty * f.p);
      remK = Math.max(0, remK - qty * f.k);
    }
  }
  V.sg = picks.length ? '💡 مقترح لإكمال يومك: ' + picks.join(' ، ') : '💡 خيارات خفيفة متبقية تناسب باقي سعراتك اليوم.';
  render();
}

// ---- Views ----
function renderHome(){
  const t = dayTotals();
  const g = S.goal;
  const workoutDates = [...new Set(S.lw.map(x => x.d))].sort();
  const td = todayStr();

  let streak = 0, idx = workoutDates.includes(td) ? 0 : 1;
  while (workoutDates.includes(todayStr(idx))) { streak++; idx++; }

  let bestStreak = 0, run = 0, prev = null;
  workoutDates.forEach(d => {
    run = (prev && daysDiff(d, prev) === 1) ? run + 1 : 1;
    if (run > bestStreak) bestStreak = run;
    prev = d;
  });

  const dueSups = S.sup.filter(s => isSupDueOn(s));
  const pendingSups = dueSups.filter(s => !isSupTakenToday(s));
  const alerts = [];
  if (pendingSups.length) {
    alerts.push({ txt: `💊 باقي ${pendingSups.length} حبة/مكمل مستحق اليوم: ${pendingSups.map(x=>x.n).join('، ')}`, tab: 'sup' });
  } else if (dueSups.length) {
    alerts.push({ txt: `✅ أنجزت جميع مكملات اليوم (${dueSups.length})`, tab: 'sup' });
  }
  if (num(S.day.w) < num(S.wg)) {
    const remW = +(num(S.wg) - num(S.day.w)).toFixed(2);
    alerts.push({ txt: `💧 باقي ${remW} لتر ماء للوصول لهدف اليوم (${S.wg} ل)`, tab: 'sup' });
  }

  const activeProg = S.pr.find(p => p.act);
  const grads = [
    'linear-gradient(135deg,#7c3aed,#ec4899)',
    'linear-gradient(135deg,#f97316,#eab308)',
    'linear-gradient(135deg,#0284c7,#6366f1)',
    'linear-gradient(135deg,#059669,#10b981)'
  ];

  const latestBody = S.body[S.body.length - 1];

// قائمة الأصناف تُحدَّث لوحدها أثناء البحث حتى لا يضيع التركيز من خانة الكتابة
function foodListHtml(){
  const q = (V.q || '').trim().toLowerCase();
  const filtered = S.foods
    .map((f, idx) => ({ f, idx }))
    .filter(({ f }) => {
      const catOk = V.cat === 'الكل' || (V.cat === '⭐' ? !!f.v : f.g === V.cat);
      const qOk = !q || f.n.toLowerCase().includes(q) || f.g.toLowerCase().includes(q);
      return catOk && qOk;
    })
    .sort((a,b) => (b.f.v?1:0) - (a.f.v?1:0));

  if (!filtered.length) return '<div class="card-soft muted">لا توجد أصناف مطابقة. استخدم «+ صنف جديد» لإضافتها.</div>';

  return filtered.map(({ f, idx }) => `
    <div class="card-soft row">
      <div style="flex:1">
        <div class="row-wrap">
          <span style="cursor:pointer;font-size:16px" onclick="S.foods[${idx}].v=!S.foods[${idx}].v;commit()">${f.v?'⭐':'☆'}</span>
          <b>${esc(f.n)}</b>
          <span class="muted">(${esc(f.u)})</span>
        </div>
        <div class="muted" style="margin-top:2px">${f.k} سعرة · بروتين ${f.p}غ · كارب ${f.h}غ · دهون ${f.f}غ</div>
      </div>
      <div class="row-wrap">
        <button class="sm" onclick="quickEat(${idx},1)" title="إضافة وحدة واحدة">+1</button>
        <button class="sm x" onclick="openAddFoodSheet(${idx},1)" title="تحديد كمية أو تعديل">كمية / ✎</button>
      </div>
    </div>
  `).join('');
}

        return `<div class="card-soft row" style="${taken?'background:#f0fdf4;border-color:#bbf7d0':''}">
          <label style="display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer">
            <input type="checkbox" ${taken?'checked':''} onchange="toggleSup('${s.id}')" style="width:18px;height:18px;margin-top:2px">
            <div>
              <b>${esc(s.n)}</b> ${s.d ? `<span class="muted">(${esc(s.d)})</span>` : ''}
              <div style="margin-top:4px">
                <span class="pill-status ${taken?'st-ok':'st-due'}">${taken?'✓ أُخذ اليوم':'اليوم لازم تاخذها'}</span>
                <span class="muted" style="margin-right:6px">${esc(freqLabel(s))}</span>
              </div>
            </div>
          </label>
          <button class="sm x" onclick="S.sup.splice(${idx},1);commit()">✕</button>
        </div>`;
      }).join('')}

      ${restList.length ? `
        <div class="muted" style="margin:12px 0 6px;font-weight:700">غير مستحقة اليوم حسب الجدول</div>
        ${restList.map(s => {
          const idx = S.sup.indexOf(s);
          const left = supDaysLeft(s);
          return `<div class="card-soft row" style="opacity:.78">
            <div>
              <b>${esc(s.n)}</b> ${s.d ? `<span class="muted">(${esc(s.d)})</span>` : ''}
              <div style="margin-top:4px">
                <span class="pill-status st-rest">اليوم مو موعدها${left ? ' — باقي ' + left + ' يوم' : ''}</span>
                <span class="muted" style="margin-right:6px">${esc(freqLabel(s))}</span>
              </div>
            </div>
            <button class="sm x" onclick="S.sup.splice(${idx},1);commit()">✕</button>
          </div>`;
        }).join('')}
      ` : ''}

      ${!S.sup.length ? '<div class="muted">لا توجد حبوب أو مكملات مضافة بعد. اضغط «+ إضافة مكمل» لتحديد الجرعة والفترة (كل يوم، يوم إي يوم لا، كل أسبوع، كل شهر...).</div>' : ''}
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <h3 style="margin:0">💧 تتبع الماء</h3>
        <span class="muted">${remWater > 0 ? `باقي ${remWater} لتر` : 'تم تحقيق الهدف ✅'}</span>
      </div>
      <div class="row-wrap" style="margin-bottom:8px">
        <b style="font-size:18px">${num(S.day.w)}</b>
        <span class="muted">من</span>
        <input type="number" step="0.5" min="0.5" value="${S.wg}" style="width:76px" onchange="S.wg=num(this.value)||3;commit()">
        <span class="muted">لتر</span>
      </div>
      <div class="row-wrap">
        <button class="sm" onclick="S.day.w=+(num(S.day.w)+0.25).toFixed(2);commit()">+0.25 ل</button>
        <button class="sm" onclick="S.day.w=+(num(S.day.w)+0.5).toFixed(2);commit()">+0.5 ل</button>
        <button class="sm x" onclick="S.day.w=Math.max(0,+(num(S.day.w)-0.25).toFixed(2));commit()">-0.25 ل</button>
      </div>
      <div class="prog-bar ${num(S.day.w)>=num(S.wg)?'ok':''}" style="margin-top:10px">
        <i style="width:${Math.min(100,num(S.day.w)/(num(S.wg)||1)*100)}%"></i>
      </div>
    </div>
  `;
}

function toggleLogDay(d){ V.openLogDays[d] = !V.openLogDays[d]; render(); }

function renderLog(){
  const months = [...new Set([
    ...S.lw.map(x => (x.d||'').slice(0,7)),
    ...Object.keys(S.lf).map(d => d.slice(0,7)),
    todayStr().slice(0,7)
  ])].filter(Boolean).sort().reverse();

  const curMo = V.mo || months[0];
  const foodDays = Object.keys(S.lf).filter(d => d.slice(0,7) === curMo).sort().reverse();
  const byDate = {};
  S.lw.filter(x => (x.d||'').slice(0,7) === curMo).forEach(x => { (byDate[x.d] = byDate[x.d] || []).push(x); });
  const workoutDays = Object.keys(byDate).sort().reverse();

  const chips = `<div class="chips">
    ${months.map(m => `<button class="chip ${m===curMo?'on':''}" onclick="V.mo='${m}';V.openLogDays={};render()">${m}</button>`).join('')}
  </div>`;

  const clearBtns = `<div class="row-wrap">
    <button class="sm x" onclick="clearMonthLog('${curMo}')">مسح الشهر</button>
    <button class="sm x" onclick="clearAllLog()">مسح الكل</button>
  </div>`;

  // ---- داخل سجل الأكل
  if (V.logView === 'food') {
    return `
      <div class="row" style="margin-bottom:8px">
        <button class="sm x" onclick="V.logView='';render()">→ السجل</button>
        <h2 style="margin:0">🍽️ سجل الأكل</h2>
      </div>
      ${chips}
      ${foodDays.length ? foodDays.map(d => {
        const info = S.lf[d];
        return `<div class="card-soft">
          <b>${esc(d)}</b> · <span style="color:var(--o);font-weight:700">${info.k} سعرة</span> · بروتين ${info.p}غ
          <div class="muted" style="margin-top:2px">${(info.i||[]).map(esc).join('، ')}</div>
        </div>`;
      }).join('') : '<div class="card muted">لا توجد سجلات أكل في هذا الشهر.</div>'}
    `;
  }

  // ---- داخل سجل التمارين: الأيام مسكّرة، اضغط على اليوم لتظهر تمارينه
  if (V.logView === 'work') {
    return `
      <div class="row" style="margin-bottom:8px">
        <button class="sm x" onclick="V.logView='';V.openLogDays={};render()">→ السجل</button>
        <h2 style="margin:0">🏋️ سجل التمارين</h2>
      </div>
      ${chips}
      ${workoutDays.length ? workoutDays.map(dateStr => {
        const list = byDate[dateStr];
        const open = !!V.openLogDays[dateStr];
        const dayTitle = [...new Set(list.map(x => `${x.p}${x.y ? ' / ' + x.y : ''}`))].join(' ، ');
        const totalVol = list.reduce((sum, x) => {
          if (Array.isArray(x.sets) && x.sets.length) return sum + x.sets.reduce((a, st) => a + num(st.r) * num(st.w), 0);
          return sum + num(x.s) * num(x.r) * num(x.w);
        }, 0);
        return `<div class="card" style="padding:12px 14px">
          <div class="day-acc-head ${open?'open':''}" onclick="toggleLogDay('${dateStr}')">
            <div>
              <b>📅 ${esc(dateStr)}</b>
              <div class="muted">${esc(dayTitle)} · ${list.length} تمارين${totalVol > 0 ? ` · حجم ${Math.round(totalVol).toLocaleString()} كغ` : ''}</div>
            </div>
            <div class="row-wrap">
              <button class="sm x" onclick="event.stopPropagation();deleteWorkoutDayLog('${dateStr}')" title="حذف سجل هذا اليوم">🗑</button>
              <span class="chev">▼</span>
            </div>
          </div>
          ${open ? `<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:8px;display:flex;flex-direction:column;gap:5px">
            ${list.map(x => {
              const summary = Array.isArray(x.sets) && x.sets.length ? formatSetsSummary(x.sets) : `${x.s}×${x.r} (${x.w}كغ)`;
              return `<div style="font-size:12.5px">• <b>${esc(x.e)}</b>: <span class="muted">${esc(summary)}</span>${x.n ? `<span class="muted"> · 📝 ${esc(x.n)}</span>` : ''}</div>`;
            }).join('')}
          </div>` : ''}
        </div>`;
      }).join('') : '<div class="card muted">لا توجد تمارين مسجلة في هذا الشهر.</div>'}
    `;
  }

  // ---- الصفحة الرئيسية للسجل: مربعين
  return `
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">📈 السجل</h2>
      ${clearBtns}
    </div>
    ${chips}
    <div class="grid2" style="margin-top:6px">
      <div class="card" style="cursor:pointer;text-align:center;margin:0;padding:22px 10px" onclick="V.logView='food';render()">
        <div style="font-size:36px">🍽️</div>
        <b style="font-size:16px">سجل الأكل</b>
        <div class="muted" style="margin-top:4px">${foodDays.length} يوم مسجّل</div>
      </div>
      <div class="card" style="cursor:pointer;text-align:center;margin:0;padding:22px 10px" onclick="V.logView='work';render()">
        <div style="font-size:36px">🏋️</div>
        <b style="font-size:16px">سجل التمارين</b>
        <div class="muted" style="margin-top:4px">${workoutDays.length} يوم تمرين</div>
      </div>
    </div>
  `;
}

function deleteWorkoutDayLog(dateStr){
  if (!confirm(`حذف سجل تمارين يوم ${dateStr}؟`)) return;
  S.lw = S.lw.filter(x => x.d !== dateStr);
  commit();
  toast('تم حذف سجل اليوم');
}

function clearMonthLog(mo){
  if (!confirm(`مسح سجلات شهر ${mo}؟`)) return;
  S.lw = S.lw.filter(x => (x.d||'').slice(0,7) !== mo);
  Object.keys(S.lf).forEach(d => { if (d.slice(0,7) === mo) delete S.lf[d]; });
  if (todayStr().slice(0,7) === mo) S.day.eat = [];
  commit();
}

function clearAllLog(){
  if (!confirm('مسح جميع سجلات التمارين والأكل؟')) return;
  S.lw = [];
  S.lf = {};
  S.day.eat = [];
  commit();
}

function render(){
  save();
  const views = {
    home: renderHome,
    prog: () => V.pIdx >= 0 ? renderProgDetail() : renderProgList(),
    food: renderFood,
    sup: renderSup,
    log: renderLog
  };
  $('#app').innerHTML = `
    <div class="topbar">
      <h1 class="brand">Y.A.S</h1>
      <span class="sub-badge">${todayStr()}</span>
    </div>
    ${(views[V.tab] || renderHome)()}
  `;

  const navItems = [
    ['home','🏠','الرئيسية'],
    ['prog','📋','الجداول'],
    ['food','🍽️','الأكل'],
    ['sup','💊','المكملات'],
    ['log','📈','السجل']
  ];
  $('#nv').innerHTML = navItems.map(([k, ic, lbl]) => `
    <button class="${V.tab===k?'on':''}" onclick="setTab('${k}')">
      <span style="font-size:17px">${ic}</span>
      <span>${lbl}</span>
    </button>
  `).join('');
  renderTimer();
}

render();
</script>
</body>
</html>
